name: build-windows

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the exe to (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pillow numpy opencv-python-headless "pywebview[winforms]" pythonnet imageio-ffmpeg pyinstaller

      - name: Build exe
        run: pyinstaller --noconfirm CutKit.spec

      - name: Rename artifact
        shell: bash
        run: mv dist/CutKit.exe CutKit-win-x64.exe

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$TAG" CutKit-win-x64.exe --clobber
